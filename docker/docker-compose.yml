# gate-tunnel 的 compose 部署
#
# 用法 (在 docker/ 目录下): cp gate.env.example gate.env, 填好后 docker compose up -d
services:
  gate-tunnel:
    image: passport888/gate-tunnel
    container_name: gate-tunnel
    restart: unless-stopped
    env_file: gate.env
    # 默认不挂 /dev/ppp, 槽位走用户态 socks 模式, 任何主机都能启动.
    # 想用 ppp 模式 (内核隧道): 宿主机先 sudo modprobe ppp_generic, 确认 /dev/ppp 存在, 再取消下面四行的注释
    # devices:
    #   - /dev/ppp
    # cap_add:
    #   - NET_ADMIN
    volumes:
      # 持久化 warp.json, 重建容器不会重新注册 WARP 设备
      - gate-etc:/etc/gate

volumes:
  gate-etc:
